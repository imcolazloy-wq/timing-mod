name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract RAR and fix folders
      run: |
        sudo apt-get update && sudo apt-get install -y unrar
        unrar x -o+ TimingTracker.rar
        # Исправляем путь к java, если она распаковалась в src/java
        if [ -d "TimingTracker/src/java" ]; then
          mkdir -p TimingTracker/src/main
          mv TimingTracker/src/java TimingTracker/src/main/
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Mod with Gradle
      working-directory: TimingTracker
      run: |
        chmod +x gradlew || true
        gradle build

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: TimingTrainer-Mod-1.21.1
        path: TimingTracker/build/libs/*.jar

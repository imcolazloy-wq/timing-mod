name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract RAR and configure project
      run: |
        sudo apt-get update && sudo apt-get install -y unrar
        unrar x -o+ TimingTracker.rar
        
        # Перемещаем исходники в правильное место src/main/java
        if [ -d "TimingTracker/src/java" ]; then
          mkdir -p TimingTracker/src/main
          mv TimingTracker/src/java TimingTracker/src/main/
        fi

        # 1. Перезаписываем settings.gradle
        cat << 'EOF' > TimingTracker/settings.gradle
        pluginManagement {
            repositories {
                maven {
                    name = 'Fabric'
                    url = 'https://fabricmc.net'
                }
                mavenCentral()
                gradlePluginPortal()
            }
        }
        rootProject.name = 'TimingTracker'
        EOF

        # 2. Перезаписываем gradle.properties чистыми значениями
        cat << 'EOF' > TimingTracker/gradle.properties
        org.gradle.jvmargs=-Xmx2G
        minecraft_version=1.21.1
        yarn_mappings=1.21.1+build.3
        loader_version=0.16.9
        fabric_version=0.105.0+1.21.1
        mod_version=1.0.0
        maven_group=com.example.timingmod
        archives_base_name=timing-trainer-mod
        EOF

        # 3. Перезаписываем build.gradle с точной рабочей версией плагина 1.7.4
        cat << 'EOF' > TimingTracker/build.gradle
        plugins {
            id 'fabric-loom' version '1.7.4'
            id 'maven-publish'
        }

        version = project.mod_version
        group = project.maven_group

        base {
            archivesName = project.archives_base_name
        }

        repositories {
            mavenCentral()
        }

        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

            implementation include("com.googlecode.soundlibs:mp3spi:1.9.5.4")
            implementation include("com.googlecode.soundlibs:jlayer:1.0.1.4")
            implementation include("com.googlecode.soundlibs:tritonus-share:0.3.7.4")
        }

        java {
            withSourcesJar()
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.10.2

    - name: Build Mod with Gradle
      working-directory: TimingTracker
      run: gradle build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: TimingTrainer-Mod-1.21.1
        path: TimingTracker/build/libs/*.jar
